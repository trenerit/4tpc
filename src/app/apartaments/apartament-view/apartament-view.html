<div class="card detail-card">
    <div class="card-header">
        <div class="header-content">
            <button [routerLink]="['/main']" class="btn btn-outline-secondary back-btn">
                ← Wróć
            </button>
            <h2>Szczegóły Apartamentu</h2>
        </div>
    </div>

    <div class="card-body">
        <div class="detail-row">
            <div class="label">ID</div>
            <div class="value">#{{data.id}}</div>
        </div>

        <div class="detail-row">
            <div class="label">Miasto</div>
            <div class="value city-value">{{data.city}}</div>
        </div>

        <div class="detail-row">
            <div class="label">Cena</div>
            <div class="value price-value">{{data.price | number:'1.2-2'}} PLN</div>
        </div>

        <div class="detail-row">
            <div class="label">Data Dodania</div>
            <div class="value">{{data.date_add | date:'d.MM.yr. H:mm'}}</div>
        </div>
    </div>
</div>
