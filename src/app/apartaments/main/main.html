<div class="card">
    <div class="card-header">
        <h2>Lista Apartamentów</h2>
        <div class="actions">
            <button class="btn btn-primary" (click)="openModal()">
                + Dodaj
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Lp</th>
                        <th>Miasto</th>
                        <th>Cena</th>
                        <th>Data Dodania</th>
                        <th class="text-right">Akcje</th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of dataFromSrv; track item.id; let i = $index) {
                    <tr [routerLink]="['/view', item.id]">
                        <td>{{i + 1}}</td>
                        <td>
                            <span class="city-badge">{{item.city}}</span>
                        </td>
                        <td class="price">{{item.price | number:'1.2-2'}} PLN</td>
                        <td class="date">{{item.date_add | date:'d.MM.yr. H:mm'}}</td>
                        <td class="text-right">
                            <button (click)="delApartments(item.id, $event)" class="btn btn-danger btn-sm">
                                Usuń
                            </button>
                        </td>
                    </tr>
                    } @empty {
                    <tr>
                        <td colspan="5" class="empty-state">Brak apartamentów do wyświetlenia.</td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>

<app-apartament-add-modal [isOpen]="isModalOpen" (close)="closeModal()" (refreshData)="getApartaments()"></app-apartament-add-modal>
