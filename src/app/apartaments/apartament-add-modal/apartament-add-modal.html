@if (isOpen) {
<div class="modal-overlay">
    <div class="modal-content" (click)="stopPropagation($event)">
        <div class="modal-header">
            <h3>Dodaj nowy apartament</h3>
            <button class="close-btn" (click)="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form #myForm="ngForm" (ngSubmit)="myFormSubmit(myForm)">
                <div class="form-group">
                    <label for="city">Miasto</label>
                    <input (keyup)="verifyObjs(myForm)" [(ngModel)] = "itemObj.city" name="city" type="text" id="city" class="form-control" placeholder="Wpisz miasto">
                </div>
                <div class="form-group">
                    <label for="price">Cena (PLN)</label>
                    <input [(ngModel)] = "itemObj.price" name="price" type="number" id="price" class="form-control" placeholder="0.00">
                </div>
                <!-- <div class="form-group">
                    <label for="description">Opis</label>
                    <textarea id="description" class="form-control" rows="3" placeholder="Dodatkowy opis..."></textarea>
                </div> -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" (click)="closeModal()">Anuluj</button>
                    <button [disabled]="compare" type="submit" class="btn btn-primary">Zapisz</button>
                </div>
            </form>
        </div>
    </div>
</div>
}
