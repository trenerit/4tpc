@if (isOpen) {
<div class="modal-overlay" (click)="closeModal()">
    <div class="modal-content" (click)="stopPropagation($event)">
        <div class="modal-header">
            <h3>Dodaj nowy apartament</h3>
            <button class="close-btn" (click)="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form>
                <div class="form-group">
                    <label for="city">Miasto</label>
                    <input type="text" id="city" class="form-control" placeholder="Wpisz miasto">
                </div>
                <div class="form-group">
                    <label for="price">Cena (PLN)</label>
                    <input type="number" id="price" class="form-control" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="description">Opis</label>
                    <textarea id="description" class="form-control" rows="3" placeholder="Dodatkowy opis..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" (click)="closeModal()">Anuluj</button>
                    <button type="button" class="btn btn-primary" (click)="closeModal()">Zapisz</button>
                </div>
            </form>
        </div>
    </div>
</div>
}
